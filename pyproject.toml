[build-system]
requires = ["setuptools>=80", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "spokenfile"
dynamic = ["version"]
description = "Format-preserving preparation of files for text-to-speech."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Holger Nahrstaedt" }]
keywords = ["tts", "text-to-speech", "normalization", "epub", "markdown", "html"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "ttsready>=0.2,<0.3",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "twine>=6,<7",
]

[project.scripts]
spokenfile = "spokenfile.cli:app"

[project.urls]
Homepage = "https://github.com/buchwandler/spokenfile"
Repository = "https://github.com/buchwandler/spokenfile"
Issues = "https://github.com/buchwandler/spokenfile/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["spokenfile*"]

[tool.setuptools.package-data]
spokenfile = ["py.typed"]

[tool.setuptools_scm]
version_file = "spokenfile/_version.py"
fallback_version = "0.1.0.dev0"
parentdir_prefix_version = "spokenfile-"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
